<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">LockBox hero title layer</title>
  <desc id="desc">Transparent title layer composed over the generated lockbox plate (hero-plate.jpg) or the Kling detonation clip.</desc>

  <defs>
    <style>
      .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <!-- darkens the left side so the title holds on any frame of the clip -->
    <linearGradient id="scrim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B0E10" stop-opacity="0.92"/>
      <stop offset="0.34" stop-color="#0B0E10" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#0B0E10" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#scrim)"/>

  <g id="title-block" class="sans" transform="translate(64 0)">
    <text x="0" y="150" class="mono" font-size="18" fill="#3FC1C9" letter-spacing="3">PORTABLE WINDOWS SANDBOX TOOLKIT</text>
    <text x="-4" y="262" font-size="112" font-weight="700" fill="#F2F4F5" letter-spacing="-2">LockBox</text>
    <text x="0" y="322" font-size="30" fill="#D5DADD">Test apps, installers and untrusted</text>
    <text x="0" y="362" font-size="30" fill="#D5DADD">files in a throwaway Windows.</text>
    <text x="0" y="402" font-size="30" font-weight="600" fill="#3FC1C9">Then destroy the machine.</text>
    <text x="0" y="476" class="mono" font-size="18" fill="#9AA3A8">GUI · CLI · Claude Code · sbx 1.2.0</text>
  </g>

  <!-- bolted-bracket motif from the lockbox frame -->
  <g id="brackets" stroke="#3FC1C9" stroke-width="3" fill="none" stroke-opacity="0.9">
    <path d="M32 64 V32 H64"/>
    <path d="M32 536 V568 H64"/>
  </g>
</svg>
