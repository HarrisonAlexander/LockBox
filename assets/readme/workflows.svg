<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LockBox workflows</title>
  <desc id="desc">Eight workflows, each in a fresh Windows Sandbox: test an app, test an installer, wrap and test a PSADT package, detonate a file, open one website, check dependencies, run a PowerShell script, and an interactive session.</desc>

  <defs>
    <style>
      .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, ui-monospace, SFMono-Regular, Menlo, monospace; }
      .card { fill: #171C1F; stroke: #2A3237; stroke-width: 1.5; }
      .t { fill: #F2F4F5; font-size: 25px; font-weight: 600; }
      .d { fill: #AEB7BC; font-size: 19px; }
      .c { font-size: 19px; }
    </style>
    <!-- bolted corner bracket, the lockbox motif -->
    <g id="brackets">
      <path d="M0 22 V0 H22" fill="none" stroke-width="3"/>
      <path d="M242 0 H264 V22" fill="none" stroke-width="3"/>
      <path d="M0 208 V230 H22" fill="none" stroke-width="3"/>
      <path d="M242 230 H264 V208" fill="none" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#101315"/>

  <g id="heading" class="sans">
    <text x="48" y="74" class="mono" font-size="18" fill="#3FC1C9" letter-spacing="3">8 WORKFLOWS · 1 THROWAWAY MACHINE</text>
    <text x="48" y="120" font-size="40" font-weight="700" fill="#F2F4F5">Pick a job. LockBox boots a clean Windows for it.</text>
  </g>

  <!-- row 1 -->
  <g id="run" class="sans" transform="translate(48 160)" stroke="#4C9BE8">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <path d="M28 30 L54 46 L28 62 Z" fill="none" stroke-width="3" stroke-linejoin="round"/>
    <text x="24" y="104" class="t" stroke="none">Test an app</text>
    <text x="24" y="138" class="d" stroke="none">Launch it clean, screen-</text>
    <text x="24" y="163" class="d" stroke="none">shot it, catch crashes</text>
    <text x="24" y="206" class="c mono" fill="#4C9BE8" stroke="none">sbx run</text>
  </g>

  <g id="install" class="sans" transform="translate(328 160)" stroke="#3FB950">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <path d="M41 28 V54 M30 44 L41 55 L52 44 M28 64 H54" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="104" class="t" stroke="none">Test an installer</text>
    <text x="24" y="138" class="d" stroke="none">Click through setup,</text>
    <text x="24" y="163" class="d" stroke="none">diff every change</text>
    <text x="24" y="206" class="c mono" fill="#3FB950" stroke="none">sbx install-test</text>
  </g>

  <g id="mwrap" class="sans" transform="translate(608 160)" stroke="#A371F7">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <path d="M28 30 H56 V40 H28 Z M31 40 V64 H53 V40 M37 50 H47" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="24" y="104" class="t" stroke="none">PSADT wrap + test</text>
    <text x="24" y="138" class="d" stroke="none">Build a PSADT v4 pack,</text>
    <text x="24" y="163" class="d" stroke="none">deploy it like Intune</text>
    <text x="24" y="206" class="c mono" fill="#A371F7" stroke="none">sbx mwrap-test</text>
  </g>

  <g id="detonate" class="sans" transform="translate(888 160)" stroke="#FF6A3D">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <path d="M42 28 L58 62 H26 Z M42 40 V50 M42 56 V57" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="24" y="104" class="t" stroke="none">Detonate a file</text>
    <text x="24" y="138" class="d" stroke="none">No network. Logs every</text>
    <text x="24" y="163" class="d" stroke="none">process, key and socket</text>
    <text x="24" y="206" class="c mono" fill="#FF6A3D" stroke="none">sbx detonate</text>
  </g>

  <!-- row 2 -->
  <g id="browse" class="sans" transform="translate(48 414)" stroke="#3FC1C9">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <circle cx="42" cy="46" r="17" fill="none" stroke-width="3"/>
    <path d="M25 46 H59 M42 29 C33 38 33 54 42 63 C51 54 51 38 42 29" fill="none" stroke-width="2.5"/>
    <text x="24" y="104" class="t" stroke="none">Open one website</text>
    <text x="24" y="138" class="d" stroke="none">Kiosk Edge locked to one</text>
    <text x="24" y="163" class="d" stroke="none">site; the rest is blocked</text>
    <text x="24" y="206" class="c mono" fill="#3FC1C9" stroke="none">--network firewall</text>
  </g>

  <g id="deps" class="sans" transform="translate(328 414)" stroke="#B392F0">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <path d="M28 32 H32 M38 32 H58 M28 46 H32 M38 46 H58 M28 60 H32 M38 60 H58" fill="none" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="104" class="t" stroke="none">Check dependencies</text>
    <text x="24" y="138" class="d" stroke="none">PE imports and runtimes,</text>
    <text x="24" y="163" class="d" stroke="none">without booting a VM</text>
    <text x="24" y="206" class="c mono" fill="#B392F0" stroke="none">sbx deps</text>
  </g>

  <g id="script" class="sans" transform="translate(608 414)" stroke="#79C0FF">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <rect x="26" y="28" width="34" height="36" rx="4" fill="none" stroke-width="3"/>
    <path d="M33 40 L39 46 L33 52 M42 54 H51" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="104" class="t" stroke="none">PowerShell script</text>
    <text x="24" y="138" class="d" stroke="none">Runs as admin, then the</text>
    <text x="24" y="163" class="d" stroke="none">box stays up to inspect</text>
    <text x="24" y="206" class="c mono" fill="#79C0FF" stroke="none">sbx exec</text>
  </g>

  <g id="session" class="sans" transform="translate(888 414)" stroke="#F0883E">
    <rect class="card" width="264" height="230" rx="14"/>
    <use href="#brackets"/>
    <rect x="24" y="28" width="38" height="26" rx="3" fill="none" stroke-width="3"/>
    <path d="M36 64 H50 M43 54 V64" fill="none" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="104" class="t" stroke="none">Interactive session</text>
    <text x="24" y="138" class="d" stroke="none">Drive it yourself, from</text>
    <text x="24" y="163" class="d" stroke="none">the CLI or Claude Code</text>
    <text x="24" y="206" class="c mono" fill="#F0883E" stroke="none">sbx start</text>
  </g>

  <text x="48" y="684" class="mono" font-size="18" fill="#7D878C">GUI: LockBox.cmd  ·  CLI: sbx.cmd  ·  same engine, same state in data\home</text>
</svg>
